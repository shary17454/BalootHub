name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# دفعة جديدة على نفس الفرع تُلغي التشغيل السابق بدل مزاحمته على العدّادات.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: اختبارات محرك BalootEngine
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: عرض إصدار Swift
        run: swift --version
      - name: تشغيل swift test
        working-directory: Packages/BalootEngine
        run: swift test

  app-build-and-test:
    name: بناء واختبار تطبيق BalootHub
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: عرض إصدار Xcode
        run: xcodebuild -version
      - name: اختيار جهاز محاكاة آيفون متاح
        id: sim
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | /usr/bin/ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            device = devices.find { |item| item["isAvailable"] && item.fetch("name").start_with?("iPhone") }
            puts device.fetch("udid") if device
          ')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "لم يُعثر على أي محاكي آيفون متاح" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "استخدام المحاكي: $SIMULATOR_ID"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      # `xcodebuild test` يبني الهدف بنفسه، فخطوة بناء منفصلة قبله كانت تُضاعف
      # زمن التشغيل بلا فائدة.
      - name: بناء واختبار (Debug)
        run: >
          xcodebuild test
          -scheme BalootHub
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}"
          -destination-timeout 120
          -parallel-testing-enabled NO
          -testLanguage ar
          -testRegion SA
          -resultBundlePath TestResults.xcresult
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO

      # نسخة Release تسلك مسارات كود مختلفة وتُبنى بتحسينات مختلفة، فبناء Debug وحده لا يثبت أن نسخة
      # المتجر تُبنى أصلًا.
      - name: بناء نسخة Release
        run: >
          xcodebuild build
          -scheme BalootHub
          -configuration Release
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}"
          -destination-timeout 120
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO

      - name: حفظ نتائج الاختبارات للمراجعة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
